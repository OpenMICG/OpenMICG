          <button class="lang-toggle" id="lang-toggle" aria-label="切换到英文">EN</button>

    <main id="main-content">
      <section class="section-block section-alt page-with-sidebar" id="research-page">
        <div class="container sidebar-layout">

                  <div id="research-outcomes" class="card-grid"></div>

              <div class="publication-section">
