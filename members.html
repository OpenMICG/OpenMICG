<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMICG | 实验室成员</title>
    <meta name="description" content="OpenMICG 成员页面：导师信息与学生成员分组展示。" />
    <meta name="keywords" content="实验室成员,导师,研究生,课题组" />
    <meta name="theme-color" content="#12324a" />
    <link rel="stylesheet" href="./assets/css/style.css?v=20260521-3" />
    <script defer src="./assets/data/site-content.js?v=20260521-3"></script>
    <script defer src="./assets/js/main.js?v=20260521-3"></script>
  </head>
  <body data-page="members">
    <a class="skip-link" id="skip-link" href="#main-content">跳转到正文</a>

    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <div class="nav-controls">
          <button class="lang-toggle" id="lang-toggle" aria-label="切换到英文">EN</button>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="hero section-block" id="home" aria-labelledby="hero-title">
        <h1 id="hero-title" class="sr-only">导师学术主页</h1>
        <div class="container hero-shell">
          <div class="hero-grid">
            <div class="hero-main reveal">
              <section class="mentor-hero-card" id="mentor-home" aria-label="导师信息">
                <article class="mentor-card mentor-featured">
                  <div class="mentor-card-main">
                    <aside class="mentor-photo mentor-photo-large" role="img" aria-label="导师照片">
                      <img id="mentor-photo-image" class="mentor-photo-image" src="./assets/images/mentor.jpg" alt="导师照片" />
                      <div id="mentor-photo-fallback" class="mentor-photo-fallback">
                        <span id="mentor-photo-label">导师照片占位</span>
                        <small id="mentor-photo-note">assets/images/mentor.jpg</small>
                      </div>
                    </aside>
                    <div class="mentor-content">
                      <h3 id="mentor-name"></h3>
                      <p class="mentor-title" id="mentor-title"></p>
                      <p id="mentor-bio"></p>
                      <ul class="hero-keywords mentor-keywords" id="hero-keywords"></ul>
                      <div class="mentor-links-block">
                        <p class="mentor-links-title" id="mentor-links-title">学术链接</p>
                        <div id="mentor-links" class="mentor-links"></div>
                      </div>
                    </div>
                  </div>
                </article>
              </section>

              <nav class="section-nav reveal" id="site-nav" aria-label="主页导航">
                <a id="nav-news" href="./index.html#news">团队动态</a>
                <a id="nav-members" class="is-active" href="./members.html">实验室团队</a>
                <a id="nav-research" href="./research.html">研究与成果</a>
                <a id="nav-join" href="./index.html#join">招生 / 加入我们</a>
              </nav>
            </div>
          </div>
        </div>
      </section>

      <section class="section-block section-alt" id="members" aria-labelledby="members-title">
        <div class="container">
          <header class="section-head reveal">
            <p class="section-label" id="members-label">Team</p>
            <h2 id="members-title">实验室团队</h2>
          </header>
          <div class="team-panel">
            <div class="team-members-wrap reveal" id="team-members">
              <div id="member-groups"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <div class="container footer-layout">
        <div>
          <h2 class="footer-title" id="footer-contact-title">联系方式</h2>
          <p id="footer-email"></p>
          <p id="footer-address"></p>
        </div>
      </div>
      <p class="footer-copy" id="footer-copy"></p>
    </footer>
  </body>
</html>
