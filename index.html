<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>余婷 | 学术主页</title>
    <meta name="description" content="导师个人学术主页：研究方向、学术服务、团队信息、科研成果与招生合作。" />
    <meta name="keywords" content="学术主页,多模态,具身智能,可信人工智能,视觉语言模型,跨媒体智能" />
    <meta name="theme-color" content="#12324a" />
    <link rel="stylesheet" href="./assets/css/style.css?v=20260521-3" />
    <script defer src="./assets/data/site-content.js?v=20260521-3"></script>
    <script defer src="./assets/js/main.js?v=20260521-3"></script>
  </head>
  <body data-page="lab">
    <a class="skip-link" id="skip-link" href="#main-content">跳转到正文</a>

    <header class="site-header" id="top">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html" aria-label="返回主页">
          <span class="brand-mark">L</span>
          <span id="nav-lab-name">OpenMICG</span>
        </a>

        <div class="nav-controls">
          <button class="lang-toggle" id="lang-toggle" aria-label="切换到英文">EN</button>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="hero section-block" id="home" aria-labelledby="hero-title">
        <h1 id="hero-title" class="sr-only">导师学术主页</h1>
        <div class="container hero-shell">
          <div class="hero-grid">
            <div class="hero-main reveal">
              <section class="mentor-hero-card" id="mentor-home" aria-label="导师信息">
                <article class="mentor-card mentor-featured">
                  <div class="mentor-card-main">
                    <aside class="mentor-photo mentor-photo-large" role="img" aria-label="导师照片">
                      <img id="mentor-photo-image" class="mentor-photo-image" src="./assets/images/mentor.jpg" alt="导师照片" />
                      <div id="mentor-photo-fallback" class="mentor-photo-fallback">
                        <span id="mentor-photo-label">导师照片占位</span>
                        <small id="mentor-photo-note">assets/images/mentor.jpg</small>
                      </div>
                    </aside>
                    <div class="mentor-content">
                      <h3 id="mentor-name"></h3>
                      <p class="mentor-title" id="mentor-title"></p>
                      <p id="mentor-bio"></p>
                      <ul class="hero-keywords mentor-keywords" id="hero-keywords"></ul>
                      <div class="mentor-links-block">
                        <p class="mentor-links-title" id="mentor-links-title">学术链接</p>
                        <div id="mentor-links" class="mentor-links"></div>
                      </div>
                    </div>
                  </div>
                </article>
              </section>

              <nav class="section-nav reveal" id="site-nav" aria-label="主页导航">
                <a id="nav-members" class="is-active" href="#members" data-view-target="members">实验室团队</a>
                <a id="nav-projects" href="#projects" data-view-target="projects">科研项目</a>
                <a id="nav-publications" href="#publications" data-view-target="publications">学术论文</a>
                <a id="nav-news" href="#news" data-view-target="news">团队动态</a>
                <a id="nav-join" href="#join" data-view-target="join">招生 / 加入我们</a>
              </nav>
            </div>
          </div>
        </div>
      </section>

      <section class="section-block section-alt" id="lab-overview">
        <div class="container">
          <div class="main-column home-main-column">
            <section class="section-block section-inner content-panel is-active" id="members" aria-labelledby="members-title" data-view-panel="members">
              <header class="section-head reveal">
                <p class="section-label" id="members-label">Team</p>
                <h2 id="members-title">实验室团队</h2>
              </header>
              <div class="team-panel">
                <div class="team-members-wrap reveal" id="team-members">
                  <div id="member-groups"></div>
                </div>
              </div>
            </section>

            <section class="section-block section-inner content-panel" id="projects" aria-labelledby="research-outcomes-title" data-view-panel="projects" hidden>
              <header class="section-head reveal">
                <p class="section-label" id="research-label">Research</p>
                <h2 id="research-outcomes-title">科研项目</h2>
              </header>
              <div class="research-layout">
                <div>
                  <div id="research-outcomes" class="project-list"></div>
                </div>
              </div>
            </section>

            <section class="section-block section-inner content-panel" id="publications" aria-labelledby="research-publications-title" data-view-panel="publications" hidden>
              <header class="section-head reveal">
                <p class="section-label" id="publications-label">Publications</p>
                <h2 id="research-publications-title">学术论文</h2>
              </header>
              <div class="publication-section">
                <div id="research-publications" class="publication-list"></div>
              </div>
            </section>

            <section class="section-block section-inner content-panel" id="news" aria-labelledby="news-title" data-view-panel="news" hidden>
              <header class="section-head reveal">
                <p class="section-label" id="news-label">Updates</p>
                <h2 id="news-title">实验室日常信息</h2>
              </header>
              <div id="news-timeline" class="timeline"></div>
            </section>

            <section class="section-block section-inner compact-join-section content-panel" id="join" aria-labelledby="join-title" data-view-panel="join" hidden>
              <header class="section-head reveal">
                <p class="section-label" id="join-label">Join Us</p>
                <h2 id="join-title">招生 / 加入我们</h2>
              </header>
              <article class="card reveal join-inline-card">
                <div class="join-inline-grid">
                  <div>
                    <h3 id="join-expectations-title">加入要求</h3>
                    <ul id="join-expectations"></ul>
                  </div>
                  <div>
                    <h3 id="join-process-title">联系流程</h3>
                    <p class="join-email"><a id="join-email" href="mailto:yut@hznu.edu.cn">联系邮箱：yut@hznu.edu.cn</a></p>
                    <ol id="join-process"></ol>
                    <p id="join-note" class="join-note"></p>
                  </div>
                </div>
              </article>
            </section>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <div class="container footer-layout">
        <div>
          <h2 class="footer-title" id="footer-contact-title">联系方式</h2>
          <p id="footer-email"></p>
          <p id="footer-address"></p>
        </div>
      </div>
      <p class="footer-copy" id="footer-copy"></p>
    </footer>
  </body>
</html>
